<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codeweb — system map</title>
<style>
  :root{
    /* Terminal Editorial — near-black, mono, square; mirrors the site tokens + brand.json.
       ONE accent (lime) for selection, focus, links and high-confidence findings — the
       only saturated color on screen. Domains sit on an 8-step LUMINANCE ramp (assigned
       by size rank, 9+ fold to neutral): identity = label + position + lightness step,
       and lightness survives every CVD type by construction — a stronger guarantee than
       the old hue palette's ΔE audit. Magnitudes (matrix, treemap) are lightness ramps
       for the same reason. No web fonts; system mono only. */
    color-scheme:dark;
    --bg:#060608; --panel:#0D0D11; --panel2:#131318; --line:#26242C;
    --fg:#E8E7EE; --muted:#8A8794; --accent:#C6F24E; --accentFg:#060608;
    --ring:rgba(255,255,255,.10);
    /* domain luminance ramp (size rank 0..7 light→dark; --nX = 9th+ fold) */
    --n0:#ECEAF1; --n1:#CDCBD7; --n2:#B1AEBD; --n3:#96939F;
    --n4:#7C7987; --n5:#646170; --n6:#4E4C59; --n7:#3B3944; --nX:#57545F;
    /* canvas-side theme reads these so the graph follows the theme (#9) */
    --cvLabel:#E8E7EE; --cvLabelDim:#C9C7D2; --cvHalo:rgba(6,6,8,0.85); --cvSel:#FFFFFF;
    /* matrix cell ink (r,g,b — alpha carries magnitude) + treemap density ramp */
    --cellInk:232,231,238;
    --tmLo:24,24,30; --tmHi:198,242,78; --tmInk:#ECECEE; --tmInkShadow:rgba(0,0,0,.8);
    /* canvas edge inks (r,g,b — alpha carries weight) */
    --edgeAcc:198,242,78; --edgeHi:236,234,241; --edgeMid:154,151,166;
  }
  /* #9: dark is the product default; "paper" light is an explicit choice, "auto" follows the OS. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F4F3EF; --panel:#FCFBF8; --panel2:#ECEAE4; --line:#D8D4CB;
    --fg:#211F27; --muted:#6E6A78; --accent:#5C7A00; --accentFg:#FFFFFF;
    --ring:rgba(0,0,0,.14);
    --n0:#211F27; --n1:#3B3944; --n2:#54515E; --n3:#6D6A78;
    --n4:#868392; --n5:#9F9CAB; --n6:#B8B5C2; --n7:#CFCCD8; --nX:#A8A5B2;
    --cvLabel:#211F27; --cvLabelDim:#4A4754; --cvHalo:rgba(244,243,239,0.85); --cvSel:#0E0D12;
    --cellInk:33,31,39;
    --tmLo:228,226,218; --tmHi:157,186,30; --tmInk:#211F27; --tmInkShadow:rgba(255,255,255,.55);
    --edgeAcc:92,122,0; --edgeHi:33,31,39; --edgeMid:110,106,120;
  }
  @media (prefers-color-scheme: light){
    :root[data-theme="auto"]{
      color-scheme:light;
      --bg:#F4F3EF; --panel:#FCFBF8; --panel2:#ECEAE4; --line:#D8D4CB;
      --fg:#211F27; --muted:#6E6A78; --accent:#5C7A00; --accentFg:#FFFFFF;
      --ring:rgba(0,0,0,.14);
      --n0:#211F27; --n1:#3B3944; --n2:#54515E; --n3:#6D6A78;
      --n4:#868392; --n5:#9F9CAB; --n6:#B8B5C2; --n7:#CFCCD8; --nX:#A8A5B2;
      --cvLabel:#211F27; --cvLabelDim:#4A4754; --cvHalo:rgba(244,243,239,0.85); --cvSel:#0E0D12;
      --cellInk:33,31,39;
      --tmLo:228,226,218; --tmHi:157,186,30; --tmInk:#211F27; --tmInkShadow:rgba(255,255,255,.55);
      --edgeAcc:92,122,0; --edgeHi:33,31,39; --edgeMid:110,106,120;
    }
  }
  /* #9: keyboard parity — every hover affordance has a :focus-visible twin. */
  .tab:focus-visible,#gctrl button:focus-visible,#roleFilter:focus-visible,#copyLink:focus-visible,#themeToggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  table.f tr:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
  #detail .lst div:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
  table.m td:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tmbox:focus-visible{outline:2px solid var(--accent);z-index:5}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  @media print{
    :root{--bg:#fff; --panel:#fff; --panel2:#f2f2f2; --line:#ccc; --fg:#000; --muted:#444; --ring:rgba(0,0,0,.2)}
    #top .tab,#gsearch,#gctrl,#gcount,#copyLink,#roleFilter,#themeToggle{display:none !important}
    #top{border-bottom:1px solid #000}
    #wrap{display:block;height:auto} #main{height:auto} #detail{border-left:none;width:auto;max-height:none}
    .view{position:static} table.f td{border-bottom:1px solid #ddd}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:12.5px/1.55 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  ::selection{background:var(--accent);color:var(--accentFg)}
  *{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--bg)}
  #top{height:48px;display:flex;align-items:center;gap:6px;padding:0 14px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #top b{font-size:14px;font-weight:700;letter-spacing:.05em;margin-right:10px}
  #top .meta{color:var(--muted);font-size:11px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #metaTarget{flex:0 0 auto;max-width:220px;color:var(--fg);margin-right:4px}
  #metaStats{flex:0 1 auto;min-width:60px;text-transform:uppercase}
  #top .spacer{flex:1}
  .vsep{width:1px;height:16px;background:var(--line);margin:0 5px;flex:none}
  .tab{background:transparent;color:var(--muted);border:1px solid transparent;
    padding:6px 8px;cursor:pointer;font:inherit;font-size:10px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .tab:hover{color:var(--fg);border-color:var(--line)}
  .tab.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
  .tab.on::before{content:"";display:inline-block;width:5px;height:5px;background:var(--accent);margin-right:7px;vertical-align:1px}
  #wrap{display:flex;height:calc(100% - 48px)}
  #main{flex:1;position:relative;min-width:0;overflow:hidden}
  .view{position:absolute;inset:0;overflow:auto;padding:16px 18px;display:none}
  .view.on{display:block}
  #view-graph.on,#view-treemap.on{padding:0}
  #detail{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
  #detail h3{margin:0 0 4px;font-size:13px;word-break:break-all}
  #detail .kv{color:var(--muted);font-size:12px;margin:3px 0}
  #detail .sec{margin-top:16px;margin-bottom:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);
    padding-top:8px;border-top:1px solid var(--line)}
  #detail .lst div{padding:3px 0;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #detail .lst div:hover{color:var(--accent)}
  #detail a{color:var(--accent)}
  #detail button:focus-visible,#detail textarea:focus-visible,#detail summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #detail .kv,#detail code{overflow-wrap:anywhere}
  .finding-action{font:inherit;padding:7px 10px;border:1px solid var(--accent);background:var(--panel2);color:var(--fg);cursor:pointer}
  #agentTaskText{display:block;width:100%;min-height:140px;margin:8px 0;padding:8px;resize:vertical;font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line)}
  .empty{color:var(--muted);padding:24px;text-align:center}
  code{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);padding:1px 5px;font-size:11px}
  /* findings */
  .fsec{margin-bottom:30px}
  .fhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:7px}
  .fhead h2{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
  .fhead h2::before{content:"";display:inline-block;width:5px;height:5px;background:var(--accent);margin-right:8px;vertical-align:1px}
  .fhead .sub{color:var(--muted);font-size:11px}
  table.f{width:100%;max-width:980px;border-collapse:collapse;font-size:12.5px}
  table.f td{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  table.f th{padding:6px 8px;text-align:left;font-size:11px;font-weight:600;color:var(--muted)}
  table.f td{overflow-wrap:anywhere}
  .fhead{flex-wrap:wrap}
  @media(max-width:720px){
    #top{height:auto;min-height:48px;flex-wrap:wrap;padding:8px}
    #wrap{display:flex;flex-direction:column;height:calc(100% - 90px)}
    #main{min-height:45vh;flex:1 0 45vh}
    #detail{width:100%;flex:1 0 40vh;border-left:0;border-top:1px solid var(--line)}
    .view{padding:12px 8px} table.f{font-size:12px}
    table.f td,table.f th{padding:6px 4px}
  }
  table.f td:first-child{width:44px}
  table.f tr:hover td{background:var(--panel2)}
  .badge{display:inline-block;min-width:26px;text-align:center;padding:1px 6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
  .b-hi{background:var(--accent);color:var(--accentFg)}
  .b-med{background:var(--fg);color:var(--bg)}
  .b-low{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
  .b-acc{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
  .mono{font-family:inherit;font-size:12px}
  .dim{color:var(--muted)}
  .pill{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:0 6px;margin-left:4px;font-variant-numeric:tabular-nums}
  /* matrix */
  table.m{border-collapse:separate;border-spacing:2px;font-size:11px}
  table.m th{padding:4px 8px;color:var(--muted);font-weight:600;text-align:right;white-space:nowrap}
  table.m th.rot{height:104px;vertical-align:bottom;text-align:center}
  table.m th.rot span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
  table.m td{width:36px;height:36px;text-align:center;cursor:pointer;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;background:var(--panel)}
  table.m td:hover{box-shadow:inset 0 0 0 2px var(--accent)}
  table.m td.diag{box-shadow:inset 0 0 0 1px var(--line)}
  table.m td.zero{color:var(--line);background:var(--panel)!important;cursor:default;box-shadow:none}
  .legend{color:var(--muted);font-size:11px;margin:12px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{display:inline-block;width:10px;height:10px;vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--ring)}
  /* treemap */
  #tm{position:absolute;inset:0;padding:6px}
  .tmbox{position:absolute;overflow:hidden;border:1px solid var(--bg);cursor:pointer;font-size:10px}
  .tmbox:hover{outline:2px solid var(--accent);z-index:5}
  .tmdom{border:1px solid var(--line);background:var(--panel);cursor:default}
  .tmlabel{position:absolute;top:1px;left:4px;right:3px;color:var(--tmInk);font-size:10px;text-shadow:0 1px 2px var(--tmInkShadow);pointer-events:none;white-space:nowrap;overflow:hidden}
  .tmdomlabel{position:absolute;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);pointer-events:none;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:5px}
  #tmLegend{position:absolute;right:14px;bottom:34px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;z-index:6}
  #tmLegend .bar{width:90px;height:8px;background:linear-gradient(90deg,rgb(var(--tmLo)),rgb(var(--tmHi)))}
  /* graph */
  #cv{display:block;background:var(--bg);touch-action:none}
  #gsearch{position:absolute;top:10px;left:10px;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:6px 9px;width:230px;font:inherit;font-size:11px}
  #gsearch::placeholder{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px}
  #gsearch:focus-visible{outline:2px solid var(--accent);border-color:var(--accent)}
  #gctrl{position:absolute;top:10px;right:10px;display:flex;gap:6px}
  #gctrl button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 9px;cursor:pointer;font:inherit;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  #gctrl button:hover{border-color:var(--accent);color:var(--accent)}
  #gLegend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);z-index:6}
  /* header brand */
  #logo{width:14px;height:14px;flex:none;margin-right:4px;image-rendering:pixelated}
  /* footer lead line */
  #brandbar{position:fixed;bottom:0;right:0;z-index:5;font-size:11px;line-height:1;padding:6px 10px;
    background:var(--panel);border-top:1px solid var(--line);border-left:1px solid var(--line);color:var(--muted)}
  #brandbar a{color:var(--accent)}
  #brandbar a.q{color:var(--muted)}
  /* mobile: the desktop app layout (fixed 340px sidebar, viewport-locked) becomes a vertical stack */
  @media (max-width: 760px){
    html,body{height:auto;min-height:100%}
    body{overflow-x:hidden}
    #top{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 12px;gap:6px;position:sticky;top:0;z-index:20}
    #top b{margin-right:4px}
    #top .meta{display:none}
    #top .spacer{display:none}
    .tab{padding:6px 8px}
    #wrap{flex-direction:column;height:auto}
    #main{flex:none;height:64vh;min-height:340px}
    #detail{width:auto;border-left:0;border-top:1px solid var(--line);max-height:none}
    .view{padding:12px 14px}
    #view-graph.on,#view-treemap.on,#view-matrix.on{padding:0}
    #view-matrix.on{padding:12px;overflow:auto}
    table.m{font-size:10px}
    table.m td{width:24px;height:24px}
    #gsearch{width:150px}
  }
  /* terminal skin: square corners everywhere (brand 2026-07) */
  *{border-radius:0 !important}
</style>
</head>
<body>
<div id="top">
  <svg id="logo" viewBox="0 0 12 12" aria-hidden="true"><rect x="0" y="0" width="5" height="5" fill="#C6F24E"/><rect x="7" y="0" width="5" height="5" fill="#57545F"/><rect x="0" y="7" width="5" height="5" fill="#57545F"/><rect x="7" y="7" width="5" height="5" fill="#8A8794"/></svg>
  <b><a href="https://github.com/GhostlyGawd/codeweb" style="color:inherit;text-decoration:none" title="codeweb on GitHub — free, MIT, runs locally">codeweb</a></b>
  <span class="meta" id="metaTarget"></span>
  <span class="meta" id="metaStats"></span>
  <span class="spacer"></span>
  <button id="roleFilter" title="Hide tests, fixtures, examples and generated code from every view" aria-pressed="true" hidden></button>
  <button id="copyLink" class="tab" title="Copy a link to this exact view (tab · filter · selection)">copy link</button>
  <button id="themeToggle" class="tab" title="Theme: dark by default — click to cycle dark → light → auto (follows your OS)"></button>
  <span class="vsep" aria-hidden="true"></span>
  <div role="tablist" aria-label="Report views" style="display:contents">
  <button class="tab on" role="tab" id="tab-findings" aria-controls="view-findings" aria-selected="true" data-view="findings">Findings</button>
  <button class="tab" role="tab" id="tab-matrix" aria-controls="view-matrix" aria-selected="false" data-view="matrix">Matrix</button>
  <button class="tab" role="tab" id="tab-treemap" aria-controls="view-treemap" aria-selected="false" data-view="treemap">Treemap</button>
  <button class="tab" role="tab" id="tab-graph" aria-controls="view-graph" aria-selected="false" data-view="graph">Graph</button>
  </div>
</div>
<div id="wrap">
  <div id="main">
    <div class="view on" id="view-findings" role="tabpanel" aria-labelledby="tab-findings"></div>
    <div class="view" id="view-matrix" role="tabpanel" aria-labelledby="tab-matrix"></div>
    <div class="view" id="view-treemap" role="tabpanel" aria-labelledby="tab-treemap"><div id="tm"></div><div id="tmLegend"><span>duplication</span><span class="bar"></span><span>0 → 100%</span></div></div>
    <div class="view" id="view-graph" role="tabpanel" aria-labelledby="tab-graph">
      <canvas id="cv" role="img" aria-label="Force-directed dependency graph"></canvas>
      <input id="gsearch" placeholder="search symbols — enter jumps" autocomplete="off" aria-label="Search symbols; press Enter to jump to the next match, Escape to clear">
      <span id="gcount" class="meta" style="position:absolute;top:16px;left:254px" aria-live="polite"></span>
      <div id="gctrl"><button id="gFit">Fit</button><button id="gToggle"></button></div>
      <div id="gLegend">■ domain — size = symbols, click expands it · ▪ symbol — size = loc · scroll zooms</div>
    </div>
  </div>
  <div id="detail"><div class="empty">Pick an item to inspect it.</div></div>
<span id="live" class="visually-hidden" aria-live="polite"></span>
</div>

<script id="graph-data" type="application/json">__GRAPH_DATA__</script>

<script>
(function () {
  "use strict";
  var G;
  try { G = JSON.parse(document.getElementById('graph-data').textContent); }
  catch (e) { document.body.innerHTML = '<p style="color:#f88;padding:24px">Failed to parse graph data: ' + e.message + '</p>'; return; }
  G.nodes = G.nodes || []; G.edges = G.edges || []; G.domains = G.domains || []; G.overlaps = G.overlaps || []; G.meta = G.meta || {};
  G.nodes.forEach(function (n) { if (!n.domain) n.domain = 'unassigned'; });

  // ---------- code roles ----------
  // Product code vs supporting code (tests / fixtures / examples / benches / generated). The
  // extractor stamps node.role; older graphs fall back to a path heuristic here. Rankings and
  // views default to PRODUCT scope — on a monorepo the map otherwise drowns in playground noise.
  function deriveRole(file) {
    var f = file || '';
    if (/(^|\/)(tests?|__tests__)\//.test(f) || /(\.test\.|\.spec\.|_test\.)/.test(f)) return 'test';
    if (/(^|\/)(fixtures?|__fixtures__|__mocks__|mocks?)\//.test(f)) return 'fixture';
    if (/(^|\/)(examples?|samples?|demos?|playgrounds?|playground|sandbox|e2e)\//.test(f)) return 'example';
    if (/(^|\/)(benchmarks?|bench|perf)\//.test(f)) return 'bench';
    if (/\.(min|bundle)\.[cm]?js$/.test(f) || /(^|\/)(generated|__generated__)\//.test(f)) return 'generated';
    return 'product';
  }
  G.nodes.forEach(function (n) { if (!n.role) n.role = deriveRole(n.file); });
  var nonProduct = G.nodes.filter(function (n) { return n.role !== 'product'; }).length;
  var productOnly = nonProduct > 0; // default: product scope whenever there is anything to hide

  // ---------- indexes (full graph — the detail panel always shows the whole truth) ----------
  var nodeById = new Map(G.nodes.map(function (n) { return [n.id, n]; }));
  var outAdj = new Map(), inAdj = new Map(), inDeg = new Map(), outDeg = new Map();
  G.nodes.forEach(function (n) { outAdj.set(n.id, []); inAdj.set(n.id, []); inDeg.set(n.id, 0); outDeg.set(n.id, 0); });
  G.edges.forEach(function (e) {
    if (!nodeById.has(e.from) || !nodeById.has(e.to)) return;
    outAdj.get(e.from).push(e.to); inAdj.get(e.to).push(e.from);
    outDeg.set(e.from, outDeg.get(e.from) + 1); inDeg.set(e.to, inDeg.get(e.to) + 1);
  });

  // Domains sit on an 8-step LUMINANCE ramp — slots by size rank (biggest = lightest), 9th+
  // folds to neutral, labels always carry identity. Lightness ordering survives every CVD type
  // by construction. The ramp lives in CSS vars (--n0..--n7): DOM surfaces reference the var,
  // the canvas resolves the same vars once per draw (cvColors) — both flip with the theme.
  var domSlot = {};
  var SLOTS = 8;
  function slotOf(nm) { return nm in domSlot ? domSlot[nm] : -1; }
  function colorOf(nm) { var i = slotOf(nm); return i >= 0 ? 'var(--n' + i + ')' : 'var(--nX)'; }

  // ---------- active scope + derived metrics (recomputed when the role filter toggles) ----------
  var AN = [], AE = [], activeIds = null, domainNames = [], duplicates = [], patterns = [], dupNodeIds = new Set(), hotspots = [], dead = [];
  var ENTRY = /^(main|index|cli|run|start|default|setup|init|activate|handler|middleware|module)$/i;
  function domCount(nm) { return AN.filter(function (n) { return n.domain === nm; }).length; }
  function computeDerived() {
    AN = productOnly ? G.nodes.filter(function (n) { return n.role === 'product'; }) : G.nodes;
    activeIds = new Set(AN.map(function (n) { return n.id; }));
    AE = G.edges.filter(function (e) { return activeIds.has(e.from) && activeIds.has(e.to); });

    domainNames = Array.from(new Set(AN.map(function (n) { return n.domain; })));
    domainNames = domainNames.filter(function (nm) { return domCount(nm) > 0; }).sort(function (a, b) { return domCount(b) - domCount(a); });
    domainNames.forEach(function (nm, i) { if (!(nm in domSlot)) domSlot[nm] = i < SLOTS ? i : -1; });

    // duplicates: same symbol name defined in >=2 files — split off INTERFACE PATTERNS (many
    // same-named implementations that nothing in-repo calls: framework hooks/contracts like a
    // bundler plugin's resolveId(). "Merge these" is wrong advice for those.)
    var byName = new Map();
    AN.forEach(function (n) {
      if (!['function', 'method', 'class'].includes(n.kind)) return;

    var id = st.s && nodeById.has(st.s) ? st.s : null;
    var tab = ['findings', 'matrix', 'treemap', 'graph'].indexOf(st.tab) >= 0 ? st.tab : (id ? 'graph' : null);
    if (tab) activate(tab);
    if (!id) return;
    if (tab === 'graph') {
      // after the first layout pass, expand JUST the target's area, then center + select
      setTimeout(function () {
        var tn = nodeById.get(id);
        if (tn && !expanded.has(tn.domain)) { expanded.add(tn.domain); gLayout(); syncToggle(); }
        var nd = W && W.idx.get(id);
        if (nd) { selectedNode = id; centerOn(nd); showNode(id); gDraw(); }
      }, REDUCED ? 50 : 900);
    } else {
      showNode(id); // inspector works from any tab; the graph flow stays graph-only
    }
  })();
})();
