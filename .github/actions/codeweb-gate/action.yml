name: 'codeweb regression gate'
description: 'Fail a pull request on a new dependency cycle, a new duplication finding, or a non-exported symbol that loses every caller — optionally posting the structural review as a sticky PR comment.'
branding:
  icon: 'git-merge'
  color: 'purple'
inputs:
  report-only:
    description: 'Report completed structural regressions without blocking. Setup or analysis errors still fail.'
    required: false
    default: 'false'
  target:
    description: 'Subdirectory to analyze, relative to the repo root.'
    required: false
    default: '.'
  codeweb-ref:
    description: >-
      The codeweb ref (branch/tag/sha) to run the gate with. Pin a release tag (e.g. v0.16.1)
      in production — the default tracks main, which moves under you.
    required: false
    default: 'main'
  history:
    description: >-
      Keep a small cross-PR metrics ledger (via actions/cache) and render the structural trend
      line in the comment — the gate accrues a trajectory instead of one-shot verdicts
      (RETENTION R7). No data leaves the repo's own Actions cache.
    required: false
    default: 'false'
  comment:
    description: >-
      Post the structural review (delta, renames, findings) as a sticky PR comment — the gate
      becomes a reviewer, not just a red X (IMPROVEMENTS.md #15). Requires the calling workflow to
      grant `permissions: pull-requests: write` and run on a pull_request event; fork PRs with a
      read-only token skip the comment gracefully and keep the check verdict.
    required: false
    default: 'false'
outputs:
  verdict-code:
    description: 'Original gate exit code: 0 clean, 1 regression, 2 setup or analysis error.'
    value: ${{ steps.gate.outputs.code }}
runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # Must match package.json engines (>=22) — a 20.x runner would die inside the gate scripts.
        node-version: '22'
    - name: Fetch codeweb
      shell: bash
      # LNG-F3b: `git clone --branch <sha>` fails — the input CLAIMED branch/tag/sha but shas
      # were broken as documented. Branch/tag keep the cheap shallow clone; a sha (no ref to
      # --branch on) falls back to clone + checkout. Env-passed, never inline-interpolated.
      env:
        CODEWEB_REF: ${{ inputs.codeweb-ref }}
      run: |
        if ! git clone --depth 1 --branch "$CODEWEB_REF" https://github.com/codeweb-hq/codeweb.git "$RUNNER_TEMP/codeweb" 2>/dev/null; then
          git clone https://github.com/codeweb-hq/codeweb.git "$RUNNER_TEMP/codeweb"
          git -C "$RUNNER_TEMP/codeweb" checkout --quiet "$CODEWEB_REF"
        fi
    - name: Restore gate history
      if: inputs.history == 'true'
      uses: actions/cache/restore@v4
      with:
        path: codeweb-gate-history.jsonl
        key: codeweb-gate-history-${{ inputs.target }}-${{ github.run_id }}
        restore-keys: |
          codeweb-gate-history-${{ inputs.target }}-
    - name: Run regression gate
      id: gate
      # The comment (if enabled) must post BEFORE the verdict can fail the job, so reviewers always
      # see the review; the verdict is enforced in the final step. The step itself always exits 0
      # and records ci-gate's REAL exit code as an output — ERRORS.md #3: exit 1 (regression) and
      # exit 2 (setup, e.g. shallow checkout) must never share one message.
      shell: bash
      # Requires the consumer to checkout with `fetch-depth: 0` so the PR base sha is present.
      # Pass inputs through env vars, NOT inline ${{ }}, so a consumer-supplied target can't inject
      # shell (the shell expands $CODEWEB_TARGET as a single token after interpolation).
      env:
        CODEWEB_TARGET: ${{ inputs.target }}
        CODEWEB_BASE: ${{ github.event.pull_request.base.sha }}
        CODEWEB_HISTORY: ${{ inputs.history }}
      run: |
        set +e
        HISTORY_ARGS=""
        if [ "$CODEWEB_HISTORY" = "true" ]; then HISTORY_ARGS="--history codeweb-gate-history.jsonl"; fi
        node "$RUNNER_TEMP/codeweb/scripts/ci-gate.mjs" \
          --base "$CODEWEB_BASE" \
          --target "$CODEWEB_TARGET" \
          --md "$RUNNER_TEMP/codeweb-gate.md" \
          $HISTORY_ARGS
        echo "code=$?" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Save gate history
      if: inputs.history == 'true'
      uses: actions/cache/save@v4
      with:
        path: codeweb-gate-history.jsonl
        key: codeweb-gate-history-${{ inputs.target }}-${{ github.run_id }}
    - name: Post structural review comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body;
          try { body = fs.readFileSync(process.env.RUNNER_TEMP + '/codeweb-gate.md', 'utf8'); }
          catch { core.info('no gate digest produced — skipping comment'); return; }
          const marker = '<!-- codeweb-gate -->';
          try {
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          } catch (e) {
            // Fork PRs carry a read-only token — keep the check verdict, skip the comment.
            core.warning(`codeweb gate comment skipped (${e.status || ''} ${e.message}) — grant 'pull-requests: write' to enable it`);
          }
    - name: Enforce gate verdict
      if: steps.gate.outputs.code != '0'
      shell: bash
      env:
        GATE_CODE: ${{ steps.gate.outputs.code }}
        CODEWEB_REPORT_ONLY: ${{ inputs.report-only }}
      run: |
        if [ "$GATE_CODE" = "1" ] && [ "$CODEWEB_REPORT_ONLY" = "true" ]; then
          echo "::warning::codeweb report-only: structural regression verdict retained; this completed finding does not block."
          exit 0
        fi
        if [ "$GATE_CODE" = "1" ]; then
          echo "::error::codeweb gate found structural regressions (see the PR comment / job log above)"
        else
          echo "::error::codeweb gate is inconclusive (exit $GATE_CODE): incomplete analysis or a setup problem. See the diagnostics in the PR comment / job log. For shallow history, use actions/checkout with 'fetch-depth: 0'."
        fi
        exit 1
