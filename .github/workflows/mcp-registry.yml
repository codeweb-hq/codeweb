# OPERATOR-ACTIONS #2, automated: publish server.json to the official MCP registry
# (registry.modelcontextprotocol.io) so MCP clients can discover codeweb. Auth is GitHub
# Actions OIDC — the workflow's identity proves the io.github.codeweb-hq namespace; no
# browser login, no stored secret. Chained via workflow_run because a `release: published`
# trigger would be dead wiring here: the release workflow publishes with GITHUB_TOKEN, and
# GITHUB_TOKEN-created events never trigger other workflows (the same recursion guard the
# release runbook documents for tags). workflow_run is exempt — it fires on the release
# workflow's completion regardless of token, and the job gates on its success.
name: mcp-registry
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_run fires on completion regardless of outcome — only republish after a
    # successful release (manual dispatch always runs).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          for ARCH in "$(uname -m)" amd64; do
            URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
            if curl -sfL "$URL" | tar xz mcp-publisher 2>/dev/null; then break; fi
          done
          test -x mcp-publisher
          ./mcp-publisher --version
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
      - name: Verify the listing
        run: |
          sleep 10
          curl -sf 'https://registry.modelcontextprotocol.io/v0/servers?search=codeweb' | tee /tmp/reg.json
          grep -q '"codeweb"\|/codeweb' /tmp/reg.json
